<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>3Goal — تعلّم الإنجليزي من يوتيوب</title>
  <meta name="description" content="حوّل فيديوهات يوتيوب الإنجليزية إلى مفردات تتعلمها وتراجعها يوميًا.">
  <meta name="theme-color" content="#F5F3EF">
  <link rel="apple-touch-icon" href="/img/3goal-mark-192.png">
  <link rel="icon" type="image/png" href="/img/3goal-mark-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="mobile-bar">
    <button class="btn icon ghost" id="menuBtn" aria-label="القائمة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="row brand-home" href="#/" style="gap:8px" aria-label="الصفحة الرئيسية">
      <span class="brand-name">3Goal</span>
      <img class="brand-logo" src="/img/3goal-mark-64.png" alt="" width="30" height="30">
    </a>
    <a class="btn icon ghost" href="#/add" aria-label="أضف">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>
  </div>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand brand-home" href="#/" aria-label="الصفحة الرئيسية">
        <img class="brand-logo" src="/img/3goal-mark-64.png" alt="" width="40" height="40">
        <div>
          <div class="brand-name">3Goal</div>
          <div class="brand-sub">تعلّم الإنجليزي من يوتيوب</div>
        </div>
      </a>
      <nav id="nav"></nav>
      <div class="sidebar-foot" id="sidebarFoot"></div>
    </aside>
    <main class="main">
      <div id="view" class="view"></div>
    </main>
  </div>

  <nav class="tabbar" id="tabbar"></nav>
  <div class="scrim" id="scrim"></div>
  <div class="modal-root" id="modalRoot"><div class="modal-backdrop"></div></div>
  <div class="toast-root" id="toastRoot"></div>

  <script type="module" src="/js/app.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
